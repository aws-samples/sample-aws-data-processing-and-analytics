AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Medallion Architecture - Autonomous Troubleshooting with AWS DevOps Agent
  Bronze (S3) → Silver (S3) → Gold (S3)
  AgentCore Gateway + Spark MCP + MWAA Orchestration

Parameters:
  GitHubScriptsBaseUrl:
    Type: String
    Default: https://raw.githubusercontent.com/aws-samples/sample-aws-data-processing-and-analytics/main/blogs/medallion-architecture-devops-agent
    Description: Base URL for Glue scripts and DAG on GitHub (no trailing slash)
  WebhookUrl:
    Type: String
    NoEcho: true
    AllowedPattern: ^https://.*$
  WebhookSecret:
    Type: String
    NoEcho: true
    MinLength: 16
Resources:
  # ============================================================
  # S3 Buckets
  # ============================================================
  GlueScriptsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AWS::StackName}-glue-scripts-${AWS::AccountId}'
      AccessControl: Private
      ObjectLockEnabled: true
      ObjectLockConfiguration:
        ObjectLockEnabled: Enabled
        Rule:
          DefaultRetention:
            Mode: GOVERNANCE
            Days: 1
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      LoggingConfiguration:
        LogFilePrefix: access-logs/
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  GlueScriptsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref GlueScriptsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: EnforceHTTPS
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !Sub 'arn:aws:s3:::${GlueScriptsBucket}'
              - !Sub 'arn:aws:s3:::${GlueScriptsBucket}/*'
            Condition:
              Bool:
                aws:SecureTransport: false

  DataLakeBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AWS::StackName}-datalake-${AWS::AccountId}'
      AccessControl: Private
      ObjectLockEnabled: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      LoggingConfiguration:
        LogFilePrefix: datalake-access-logs/
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: AutoDeleteTempFiles
            Status: Enabled
            Prefix: temp/
            ExpirationInDays: 1

  DataLakeBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DataLakeBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: EnforceHTTPS
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !Sub 'arn:aws:s3:::${DataLakeBucket}'
              - !Sub 'arn:aws:s3:::${DataLakeBucket}/*'
            Condition:
              Bool:
                aws:SecureTransport: false

  MwaaBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AWS::StackName}-mwaa-nolock-${AWS::AccountId}'
      AccessControl: Private
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      LoggingConfiguration:
        LogFilePrefix: mwaa-access-logs/
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # MwaaBucketPolicy removed - EnforceHTTPS Deny policy blocks MWAA internal DAG sync
  # MWAA manages its own S3 access; bucket is already private with encryption enabled

  # ============================================================
  # Lambda Security Group (for VPC-attached Lambdas)
  # ============================================================
  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for VPC-attached Lambda functions
      VpcId: !Ref GlueVPC
      SecurityGroupEgress:
        - Description: HTTPS to AWS VPC endpoints
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 10.0.0.0/16
        - Description: HTTPS to external endpoints via NAT
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-lambda-sg'

  # ============================================================
  # Lambda DLQ Queues
  # ============================================================
  ScriptPopulatorDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${AWS::StackName}-script-populator-dlq'
      MessageRetentionPeriod: 1209600
      KmsMasterKeyId: alias/aws/sqs  # Note: 'KmsMasterKeyId' is an AWS CloudFormation API property name

  WebHookExecutorDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${AWS::StackName}-webhook-executor-dlq'
      MessageRetentionPeriod: 1209600
      KmsMasterKeyId: alias/aws/sqs  # Note: 'KmsMasterKeyId' is an AWS CloudFormation API property name

  SparkMcpProxyDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${AWS::StackName}-spark-mcp-proxy-dlq'
      MessageRetentionPeriod: 1209600
      KmsMasterKeyId: alias/aws/sqs  # Note: 'KmsMasterKeyId' is an AWS CloudFormation API property name

  # ============================================================
  # Auto-populate scripts from GitHub
  # ============================================================
  ScriptPopulatorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-ScriptPopulator'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref ScriptPopulatorPolicy

  ScriptPopulatorPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${AWS::StackName}-ScriptPopulatorPolicy'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: ['s3:PutObject', 's3:DeleteObject']
            Resource:
              - !Sub 'arn:aws:s3:::${GlueScriptsBucket}/*'
              - !Sub 'arn:aws:s3:::${MwaaBucket}/*'
          - Effect: Allow
            Action: ['logs:CreateLogGroup', 'logs:CreateLogStream', 'logs:PutLogEvents']
            Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-ScriptPopulator:*'
          - Effect: Allow
            Action: ['ec2:CreateNetworkInterface', 'ec2:DeleteNetworkInterface']
            Resource: !Sub 'arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:*'
          - Effect: Allow
            Action: ['ec2:DescribeNetworkInterfaces']
            Resource: '*'
          - Effect: Allow
            Action: ['sqs:SendMessage']
            Resource: !GetAtt ScriptPopulatorDLQ.Arn

  ScriptPopulatorFunction:
    Type: AWS::Lambda::Function
    DependsOn: ScriptPopulatorPolicy
    Properties:
      FunctionName: !Sub '${AWS::StackName}-ScriptPopulator'
      Runtime: python3.14
      Handler: index.handler
      Timeout: 120
      MemorySize: 256
      ReservedConcurrentExecutions: 5
      Role: !GetAtt ScriptPopulatorRole.Arn
      DeadLetterConfig:
        TargetArn: !GetAtt ScriptPopulatorDLQ.Arn
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - !Ref MwaaSubnet1
          - !Ref MwaaSubnet2
      Code:
        ZipFile: |
          import json, urllib.request, boto3, cfnresponse
          s3 = boto3.client('s3')
          def handler(event, context):
              try:
                  props = event['ResourceProperties']
                  base_url = props['GitHubBaseUrl']
                  glue_bucket = props['GlueBucket']
                  mwaa_bucket = props['MwaaBucket']
                  files = json.loads(props['Files'])
                  if event['RequestType'] in ['Create', 'Update']:
                      for f in files:
                          url = f"{base_url}/{f['src']}"
                          print(f"Downloading {url}")
                          resp = urllib.request.urlopen(url)
                          content = resp.read()
                          bucket = glue_bucket if f['dest'].startswith('scripts/') else mwaa_bucket
                          key = f['dest']
                          print(f"Uploading to s3://{bucket}/{key}")
                          s3.put_object(Bucket=bucket, Key=key, Body=content)
                  elif event['RequestType'] == 'Delete':
                      for f in files:
                          bucket = glue_bucket if f['dest'].startswith('scripts/') else mwaa_bucket
                          try:
                              s3.delete_object(Bucket=bucket, Key=f['dest'])
                          except Exception:
                              pass
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {'Status': 'OK'})
              except Exception as e:
                  print(f"Error: {e}")
                  cfnresponse.send(event, context, cfnresponse.FAILED, {'Error': str(e)})

  PopulateScripts:
    Type: Custom::PopulateScripts
    DependsOn:
      - ScriptPopulatorFunction
      - GlueScriptsBucket
      - MwaaBucket
    Properties:
      ServiceToken: !GetAtt ScriptPopulatorFunction.Arn
      GitHubBaseUrl: !Ref GitHubScriptsBaseUrl
      GlueBucket: !Ref GlueScriptsBucket
      MwaaBucket: !Ref MwaaBucket
      Files: !Sub |
        [
          {"src": "glue-scripts/bronze_layer_ingestion.py", "dest": "scripts/bronze_layer_ingestion.py"},
          {"src": "glue-scripts/silver_layer_transform.py", "dest": "scripts/silver_layer_transform.py"},
          {"src": "glue-scripts/gold_layer_aggregate.py", "dest": "scripts/gold_layer_aggregate.py"},
          {"src": "dags/medallion_pipeline.py", "dest": "dags/medallion_pipeline.py"}
        ]

  # ============================================================
  # VPC for Glue jobs
  # ============================================================
  GlueVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-glue-vpc'

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref GlueVPC
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: false
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-private-1'

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref GlueVPC
      CidrBlock: 10.0.2.0/24
      MapPublicIpOnLaunch: false
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-private-2'

  GlueSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Glue connection security group
      VpcId: !Ref GlueVPC
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-glue-sg'

  GlueSGSelfRefIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref GlueSecurityGroup
      IpProtocol: tcp
      FromPort: 0
      ToPort: 65535
      SourceSecurityGroupId: !Ref GlueSecurityGroup
      Description: Self-referencing rule for Glue Spark executor communication

  # S3 VPC Endpoint so Glue can reach S3 from within the VPC
  S3VPCEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref GlueVPC
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PrivateRouteTable
        - !Ref MwaaRouteTable

  # Interface VPC Endpoints for private connectivity (eliminates 0.0.0.0/0 egress)
  VPCEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for VPC Interface Endpoints
      VpcId: !Ref GlueVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 10.0.0.0/16
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-vpce-sg'

  LogsVPCEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref GlueVPC
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.logs'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup

  SQSVPCEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref GlueVPC
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.sqs'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup

  SecretsManagerVPCEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref GlueVPC
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.secretsmanager'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup

  GlueVPCEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref GlueVPC
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.glue'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup

  RedshiftVPCEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref GlueVPC
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.redshift'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref GlueVPC

  PrivateSubnet1RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  # MWAA subnets (separate, with NAT for internet access)
  MwaaSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref GlueVPC
      CidrBlock: 10.0.10.0/24
      MapPublicIpOnLaunch: false
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-mwaa-1'

  MwaaSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref GlueVPC
      CidrBlock: 10.0.11.0/24
      MapPublicIpOnLaunch: false
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-mwaa-2'

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  IGWAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref GlueVPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref GlueVPC
      CidrBlock: 10.0.100.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref GlueVPC

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: IGWAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  NatEIP:
    Type: AWS::EC2::EIP
    DependsOn: IGWAttachment

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEIP.AllocationId
      SubnetId: !Ref PublicSubnet

  MwaaRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref GlueVPC

  MwaaRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref MwaaRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  MwaaSubnet1RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref MwaaSubnet1
      RouteTableId: !Ref MwaaRouteTable

  MwaaSubnet2RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref MwaaSubnet2
      RouteTableId: !Ref MwaaRouteTable

  MwaaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: MWAA environment security group
      VpcId: !Ref GlueVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 10.0.0.0/16
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: 10.0.0.0/16

  S3PrefixList:
    Type: AWS::EC2::PrefixList
    Properties:
      PrefixListName: !Sub '${AWS::StackName}-s3-prefix'
      AddressFamily: IPv4
      MaxEntries: 5
      Entries:
        - Cidr: 3.5.0.0/19
          Description: S3 us-west-2

  MwaaSGSelfRefHttps:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref MwaaSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref MwaaSecurityGroup

  MwaaSGSelfRefPostgres:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref MwaaSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref MwaaSecurityGroup

  # ============================================================
  # KMS Keys
  # ============================================================
  SecretsEncryptionKey:
    Type: AWS::KMS::Key
    Properties:
      Description: KMS key for Secrets Manager encryption
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableRootAccess
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: AllowSecretsManager
            Effect: Allow
            Principal:
              Service: secretsmanager.amazonaws.com
            Action: ['kms:Decrypt', 'kms:GenerateDataKey']
            Resource: '*'

  LambdaEncryptionKey:
    Type: AWS::KMS::Key
    Properties:
      Description: KMS key for Lambda environment variable encryption
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableRootAccess
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: AllowLambda
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: ['kms:Decrypt', 'kms:DescribeKey']
            Resource: '*'

  CloudWatchLogsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: KMS key for CloudWatch Logs encryption
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableRootAccess
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: AllowCloudWatchLogs
            Effect: Allow
            Principal:
              Service: !Sub 'logs.${AWS::Region}.amazonaws.com'
            Action: ['kms:Encrypt*', 'kms:Decrypt*', 'kms:ReEncrypt*', 'kms:GenerateDataKey*', 'kms:Describe*']
            Resource: '*'
            Condition:
              ArnLike:
                kms:EncryptionContext:aws:logs:arn: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:*'

  # ============================================================
  # Secrets Manager
  # ============================================================
  WebHookCredentialsSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${AWS::StackName}-webhook-credentials'
      Description: DevOps Agent WebHook credentials
      SecretString: !Sub '{"webhookUrl":"${WebhookUrl}","webhookSecret":"${WebhookSecret}"}'
      KmsKeyId: !Ref SecretsEncryptionKey

  RedshiftCredentialsSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${AWS::StackName}-redshift-credentials'
      Description: Redshift admin credentials
      GenerateSecretString:
        SecretStringTemplate: '{"username":"admin"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludeCharacters: ' "/@\'''
      KmsKeyId: !Ref SecretsEncryptionKey

  # ============================================================
  # Redshift Cluster
  # ============================================================
  RedshiftSubnetGroup:
    Type: AWS::Redshift::ClusterSubnetGroup
    Properties:
      Description: Subnet group for Redshift
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2

  RedshiftCluster:
    Type: AWS::Redshift::Cluster
    DependsOn: RedshiftCredentialsSecret
    Properties:
      ClusterIdentifier: !Sub '${AWS::StackName}-redshift'
      DBName: medalliondb
      MasterUsername: admin
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${RedshiftCredentialsSecret}:SecretString:password}}'
      NodeType: ra3.large
      ClusterType: single-node
      PubliclyAccessible: false
      Encrypted: true
      ClusterSubnetGroupName: !Ref RedshiftSubnetGroup
      VpcSecurityGroupIds:
        - !Ref GlueSecurityGroup
      IamRoles:
        - !GetAtt RedshiftS3Role.Arn

  RedshiftS3Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-RedshiftS3Role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: redshift.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref RedshiftS3Policy

  RedshiftS3Policy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${AWS::StackName}-RedshiftS3Policy'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: ['s3:GetObject', 's3:ListBucket', 's3:PutObject', 's3:DeleteObject', 's3:GetBucketLocation']
            Resource:
              - !Sub 'arn:aws:s3:::${DataLakeBucket}'
              - !Sub 'arn:aws:s3:::${DataLakeBucket}/*'

  RedshiftGlueConnection:
    Type: AWS::Glue::Connection
    Properties:
      CatalogId: !Ref 'AWS::AccountId'
      ConnectionInput:
        Name: !Sub '${AWS::StackName}-redshift-conn'
        ConnectionType: JDBC
        ConnectionProperties:
          JDBC_CONNECTION_URL: !Sub
            - 'jdbc:redshift://${Endpoint}:5439/medalliondb'
            - Endpoint: !GetAtt RedshiftCluster.Endpoint.Address
          SECRET_ID: !Ref RedshiftCredentialsSecret
        PhysicalConnectionRequirements:
          SubnetId: !Ref PrivateSubnet1
          SecurityGroupIdList:
            - !Ref GlueSecurityGroup
          AvailabilityZone: !Select [0, !GetAZs '']

  # ============================================================
  # IAM Role - Glue Jobs
  # ============================================================
  GlueJobRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-GlueRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole
        - !Ref GlueJobPolicy

  GlueJobPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${AWS::StackName}-GlueJobPolicy'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
