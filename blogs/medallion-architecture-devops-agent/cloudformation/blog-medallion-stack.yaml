        '--enable-metrics': 'true'
        '--enable-continuous-cloudwatch-log': 'true'
        '--enable-job-insights': 'true'
        '--enable-spark-ui': 'true'
        '--spark-event-logs-path': !Sub 's3://${GlueScriptsBucket}/sparkHistoryLogs/'
        '--bronze_output_path': !Sub 's3://${DataLakeBucket}/bronze/ecommerce_orders/'
