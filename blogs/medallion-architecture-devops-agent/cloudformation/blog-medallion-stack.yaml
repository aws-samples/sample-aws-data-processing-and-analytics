  # Scripts and DAG are auto-populated from GitHub via Custom Resource (PopulateScripts)

  # ============================================================
  # Lambda - WebHook Executor (EventBridge → DevOps Agent)
  # ============================================================
  WebHookExecutorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-WHookRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref WebHookExecutorPolicy

  WebHookExecutorPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${AWS::StackName}-WebHookExecutorPolicy'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: ['logs:CreateLogStream', 'logs:PutLogEvents']
            Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-WebHookExecutor:*'
          - Effect: Allow
            Action: ['ec2:CreateNetworkInterface', 'ec2:DeleteNetworkInterface']
            Resource: !Sub 'arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:*'
          - Effect: Allow
            Action: ['ec2:DescribeNetworkInterfaces']
            Resource: '*'
          - Effect: Allow
            Action: ['secretsmanager:GetSecretValue']
            Resource: !Ref WebHookCredentialsSecret
          - Effect: Allow
            Action: ['kms:Decrypt']
            Resource: !GetAtt SecretsEncryptionKey.Arn
          - Effect: Allow
            Action: ['sqs:SendMessage']
            Resource: !GetAtt WebHookExecutorDLQ.Arn

  WebHookExecutorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-WebHookExecutor'
      RetentionInDays: 90
      KmsKeyId: !GetAtt CloudWatchLogsKey.Arn

  WebHookExecutorFunction:
    Type: AWS::Lambda::Function
    DependsOn:
      - WebHookExecutorLogGroup
      - WebHookExecutorPolicy
    Properties:
      FunctionName: !Sub '${AWS::StackName}-WebHookExecutor'
      Description: Invokes DevOps Agent WebHook when Glue job fails
      Runtime: python3.14
      Handler: index.handler
      Timeout: 900
      MemorySize: 128
      ReservedConcurrentExecutions: 10
      KmsKeyArn: !GetAtt LambdaEncryptionKey.Arn
      Role: !GetAtt WebHookExecutorRole.Arn
      DeadLetterConfig:
        TargetArn: !GetAtt WebHookExecutorDLQ.Arn
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - !Ref MwaaSubnet1
          - !Ref MwaaSubnet2
      Environment:
        Variables:
          SECRET_NAME: !Sub '${AWS::StackName}-webhook-credentials'
      Code:
        ZipFile: |
          import json, hmac, hashlib, base64, os
          from datetime import datetime
          import urllib3, boto3
          http = urllib3.PoolManager()
          secrets_client = boto3.client('secretsmanager')
          def handler(event, context):
              print(f"EventBridge event: {json.dumps(event, default=str)}")
              secret = json.loads(secrets_client.get_secret_value(SecretId=os.environ['SECRET_NAME'])['SecretString'])
              detail = event.get('detail', {})
              job_name = detail.get('jobName', 'Unknown')
              job_run_id = detail.get('jobRunId', 'Unknown')
              state = detail.get('state', 'FAILED')
              message = detail.get('message', 'No error message')
              region = event.get('region', 'unknown')
              account = event.get('account', 'Unknown')
              timestamp = datetime.utcnow().isoformat() + 'Z'
              payload = json.dumps({
                  'eventType': 'incident', 'incidentId': f"glue-{job_name}-{job_run_id}",
                  'action': 'created', 'priority': 'HIGH',
                  'title': f"Glue Job Failed: {job_name}",
                  'description': f"AWS Glue job \"{job_name}\" entered {state} state.\nJob Run ID: {job_run_id}\nError: {message}\nRegion: {region}\nAccount: {account}",
                  'service': 'AWS/Glue', 'timestamp': timestamp,
                  'affectedResources': [f"arn:aws:glue:{region}:{account}:job/{job_name}"],
                  'data': {'metadata': detail}
              })
              sig = base64.b64encode(hmac.new(secret['webhookSecret'].encode(), f"{timestamp}:{payload}".encode(), hashlib.sha256).digest()).decode()
              resp = http.request('POST', secret['webhookUrl'], body=payload.encode(), headers={
                  'Content-Type': 'application/json', 'x-amzn-event-signature': sig, 'x-amzn-event-timestamp': timestamp
              })
              print(f"WebHook response: Status={resp.status}")
              return {'statusCode': resp.status}

  WebHookExecutorAsyncConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref WebHookExecutorFunction
      Qualifier: $LATEST
      MaximumRetryAttempts: 0

  WebHookExecutorInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref WebHookExecutorFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt GlueJobFailureRule.Arn

  # ============================================================
  # EventBridge Rule - Glue Job Failure Detection
  # ============================================================
  GlueJobFailureRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${AWS::StackName}-Glue-Job-Failure'
      Description: !Sub 'Triggers DevOps Agent when ${AWS::StackName} Glue jobs fail'
      EventPattern:
        source: [aws.glue]
        detail-type: [Glue Job State Change]
        detail:
          state: [FAILED, TIMEOUT, ERROR]
          jobName:
            - prefix: !Sub '${AWS::StackName}-'
      Targets:
        - Arn: !GetAtt WebHookExecutorFunction.Arn
          Id: InvokeWebHookExecutor
          DeadLetterConfig:
            Arn: !GetAtt EventBridgeDLQ.Arn
          RetryPolicy:
            MaximumRetryAttempts: 3
            MaximumEventAgeInSeconds: 3600

  EventBridgeDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${AWS::StackName}-eventbridge-dlq'
      MessageRetentionPeriod: 1209600
      KmsMasterKeyId: alias/aws/sqs  # Note: 'KmsMasterKeyId' is an AWS CloudFormation API property name

  EventBridgeDLQPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref EventBridgeDLQ]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt EventBridgeDLQ.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt GlueJobFailureRule.Arn

  # ============================================================
  # Spark MCP SigV4 Proxy Lambda
  # ============================================================
  SparkMcpProxyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-McpProxy'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref SparkMcpProxyPolicy

  SparkMcpProxyPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${AWS::StackName}-SparkMcpProxyPolicy'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: ['logs:CreateLogStream', 'logs:PutLogEvents']
            Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-SparkMCP-SigV4-Proxy:*'
          - Effect: Allow
            Action: ['ec2:CreateNetworkInterface', 'ec2:DeleteNetworkInterface']
            Resource: !Sub 'arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:*'
          - Effect: Allow
            Action: ['ec2:DescribeNetworkInterfaces']
            Resource: '*'
          - Effect: Allow
            Action: ['sagemaker-unified-studio-mcp:InvokeMcp', 'sagemaker-unified-studio-mcp:CallReadOnlyTool', 'sagemaker-unified-studio-mcp:CallPrivilegedTool']
            Resource: '*'
          - Effect: Allow
            Action: ['glue:GetJobRun', 'glue:GetJobRuns', 'glue:GetJob', 'glue:BatchGetJobs']
            Resource:
              - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:job/${AWS::StackName}-*'
          - Effect: Allow
            Action: ['logs:GetLogEvents', 'logs:FilterLogEvents', 'logs:DescribeLogGroups', 'logs:DescribeLogStreams']
            Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:*'
          - Effect: Allow
            Action: ['sqs:SendMessage']
            Resource: !GetAtt SparkMcpProxyDLQ.Arn

  SparkMcpProxyLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-SparkMCP-SigV4-Proxy'
      RetentionInDays: 90
      KmsKeyId: !GetAtt CloudWatchLogsKey.Arn

  SparkMcpProxyFunction:
    Type: AWS::Lambda::Function
    DependsOn:
      - SparkMcpProxyLogGroup
      - SparkMcpProxyPolicy
    Properties:
      FunctionName: !Sub '${AWS::StackName}-SparkMCP-SigV4-Proxy'
      Description: Bridges AgentCore Gateway to Spark MCP Server via SigV4
      Runtime: python3.14
      Handler: index.lambda_handler
      Role: !GetAtt SparkMcpProxyRole.Arn
      Timeout: 120
      MemorySize: 128
      ReservedConcurrentExecutions: 20
      KmsKeyArn: !GetAtt LambdaEncryptionKey.Arn
      DeadLetterConfig:
        TargetArn: !GetAtt SparkMcpProxyDLQ.Arn
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - !Ref MwaaSubnet1
          - !Ref MwaaSubnet2
      Environment:
        Variables:
          MCP_ENDPOINT: 'https://sagemaker-unified-studio-mcp.us-east-1.api.aws/spark-troubleshooting'
          SIGV4_SERVICE: 'sagemaker-unified-studio-mcp'
          SIGV4_REGION: 'us-east-1'
          TOOL_NAME: 'analyze_spark_workload'
      Code:
        ZipFile: |
          import json, os, urllib.request, logging
          from botocore.auth import SigV4Auth
          from botocore.awsrequest import AWSRequest
          import botocore.session
          logger = logging.getLogger()
          logger.setLevel(logging.INFO)
          def lambda_handler(event, context):
              logger.info(f"Invocation: {json.dumps(event, default=str)}")
              delimiter = "___"
              try:
                  original = context.client_context.custom['bedrockAgentCoreToolName']
                  tool_name = original[original.index(delimiter) + len(delimiter):]
              except Exception:
                  tool_name = os.environ.get("TOOL_NAME", "analyze_spark_workload")
              body = json.dumps({"jsonrpc": "2.0", "method": "tools/call", "params": {"name": tool_name, "arguments": event}, "id": 1})
              url = f"{os.environ['MCP_ENDPOINT']}/mcp"
              session = botocore.session.get_session()
              creds = session.get_credentials().get_frozen_credentials()
              request = AWSRequest(method="POST", url=url, data=body, headers={"Content-Type": "application/json", "Accept": "application/json"})
              SigV4Auth(creds, os.environ['SIGV4_SERVICE'], os.environ['SIGV4_REGION']).add_auth(request)
              req = urllib.request.Request(url=url, data=body.encode(), method="POST", headers=dict(request.headers))
              try:
                  with urllib.request.urlopen(req) as resp:
                      return json.loads(resp.read().decode())
              except urllib.request.HTTPError as e:
                  error_body = e.read().decode()
                  logger.error(f"HTTP {e.code}: {error_body}")
                  return {"error": error_body, "statusCode": e.code}

  SparkMcpProxyGatewayPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SparkMcpProxyFunction
      Action: lambda:InvokeFunction
      Principal: bedrock-agentcore.amazonaws.com
      SourceArn: !GetAtt AgentCoreGateway.GatewayArn

  # ============================================================
  # Cognito + AgentCore Gateway
  # ============================================================
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-AgentCore-Auth'
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true

  CognitoResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      UserPoolId: !Ref CognitoUserPool
      Identifier: !Sub '${AWS::StackName}-mcp-proxy'
      Name: MCP Proxy API
      Scopes:
        - ScopeName: invoke
          ScopeDescription: Invoke MCP tools via AgentCore Gateway

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: CognitoResourceServer
    Properties:
      ClientName: !Sub '${AWS::StackName}-DevOpsAgent-Client'
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: true
      AllowedOAuthFlows: [client_credentials]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes: [!Sub '${AWS::StackName}-mcp-proxy/invoke']
      ExplicitAuthFlows: [ALLOW_REFRESH_TOKEN_AUTH]

  CognitoUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub '${AWS::StackName}-${AWS::AccountId}'
      UserPoolId: !Ref CognitoUserPool

  AgentCoreGatewayRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-ACGW'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref 'AWS::AccountId'
      ManagedPolicyArns:
        - !Ref AgentCoreGatewayPolicy

  AgentCoreGatewayPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${AWS::StackName}-AgentCoreGatewayPolicy'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: lambda:InvokeFunction
            Resource: !GetAtt SparkMcpProxyFunction.Arn

  AgentCoreGateway:
    Type: AWS::BedrockAgentCore::Gateway
    Properties:
      Name: !Sub '${AWS::StackName}-SparkMCP-GW'
      Description: AgentCore Gateway for Spark Troubleshooting MCP Server
      ProtocolType: MCP
      RoleArn: !GetAtt AgentCoreGatewayRole.Arn
      AuthorizerType: CUSTOM_JWT
      AuthorizerConfiguration:
        CustomJWTAuthorizer:
          DiscoveryUrl: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPool}/.well-known/openid-configuration'
          AllowedClients: [!Ref CognitoUserPoolClient]

  AgentCoreGatewayTarget:
    Type: AWS::BedrockAgentCore::GatewayTarget
    Properties:
      GatewayIdentifier: !GetAtt AgentCoreGateway.GatewayIdentifier
      Name: spark
      Description: Lambda target bridging to Spark MCP Server via SigV4
      TargetConfiguration:
        Mcp:
          Lambda:
            LambdaArn: !GetAtt SparkMcpProxyFunction.Arn
            ToolSchema:
              InlinePayload:
                - Name: analyze_spark_workload
                  Description: >-
                    Comprehensive analysis tool for Apache Spark workloads on AWS (EMR-EC2, Glue, EMR-Serverless).
                    Provides troubleshooting for failed workloads and optimization insights.
                  InputSchema:
                    Type: object
                    Properties:
                      platform_type:
                        Type: string
                        Description: 'AWS platform: EMR_EC2, GLUE, EMR_SERVERLESS, or SAGEMAKER_UNIFIED_STUDIO'
                      platform_params:
                        Type: object
                        Description: 'Platform-specific params. For GLUE: {job_name, job_run_id}.'
                    Required: [platform_type, platform_params]
      CredentialProviderConfigurations:
        - CredentialProviderType: GATEWAY_IAM_ROLE

  # ============================================================
  # CloudTrail Log Group for Security Monitoring
  # ============================================================
  CloudTrailLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/cloudtrail/${AWS::StackName}-trail'
      RetentionInDays: 90
      KmsKeyId: !GetAtt CloudWatchLogsKey.Arn

  # ============================================================
  # M8: CloudWatch Alarm - Unauthorized Secrets Manager Access
  # ============================================================
  SecretsManagerAccessMetricFilter:
    DependsOn: CloudTrailLogGroup
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Sub '/aws/cloudtrail/${AWS::StackName}-trail'
      FilterPattern: '{ ($.eventSource = "secretsmanager.amazonaws.com") && (($.errorCode = "AccessDenied") || ($.errorCode = "UnauthorizedAccess")) }'
      MetricTransformations:
        - MetricNamespace: !Sub '${AWS::StackName}/Security'
          MetricName: UnauthorizedSecretsManagerAccess
          MetricValue: '1'
          DefaultValue: 0

  UnauthorizedSecretsAccessAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-UnauthorizedSecretsAccess'
      AlarmDescription: Alarm when unauthorized access to Secrets Manager is detected
      Namespace: !Sub '${AWS::StackName}/Security'
      MetricName: UnauthorizedSecretsManagerAccess
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  SecretsManagerGetSecretMetricFilter:
    DependsOn: CloudTrailLogGroup
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Sub '/aws/cloudtrail/${AWS::StackName}-trail'
      FilterPattern: '{ ($.eventSource = "secretsmanager.amazonaws.com") && ($.eventName = "GetSecretValue") && ($.errorCode NOT EXISTS) }'
      MetricTransformations:
        - MetricNamespace: !Sub '${AWS::StackName}/Security'
          MetricName: SecretsManagerGetSecretValueCalls
          MetricValue: '1'
          DefaultValue: 0

  SecretsManagerGetSecretAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-SecretsManagerGetSecretValue'
      AlarmDescription: Alarm on successful Secrets Manager GetSecretValue calls for credential access monitoring
      Namespace: !Sub '${AWS::StackName}/Security'
      MetricName: SecretsManagerGetSecretValueCalls
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

# ============================================================
# Outputs
# ============================================================
Outputs:
  BronzeJobName:
    Value: !Ref BronzeGlueJob
  SilverJobName:
    Value: !Ref SilverGlueJob
  GoldJobName:
    Value: !Ref GoldGlueJob
  DataLakeBucketName:
    Value: !Ref DataLakeBucket
  GlueScriptsBucketName:
    Value: !Ref GlueScriptsBucket
  MwaaBucketName:
    Value: !Ref MwaaBucket
  MwaaEnvironmentName:
    Value: !Ref MwaaEnvironment
  AgentCoreGatewayUrl:
    Value: !GetAtt AgentCoreGateway.GatewayUrl
  AgentCoreGatewayId:
    Value: !GetAtt AgentCoreGateway.GatewayIdentifier
  CognitoTokenEndpoint:
    Value: !Sub 'https://${AWS::StackName}-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com/oauth2/token'
  CognitoClientId:
    Value: !Ref CognitoUserPoolClient
  EventBridgeRuleName:
    Value: !Ref GlueJobFailureRule
  RedshiftClusterEndpoint:
    Value: !GetAtt RedshiftCluster.Endpoint.Address
