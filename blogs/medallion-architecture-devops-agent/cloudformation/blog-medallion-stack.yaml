              - !Sub 'arn:aws:redshift:${AWS::Region}:${AWS::AccountId}:dbgroup:${AWS::StackName}-redshift/*'
              - !Sub 'arn:aws:redshift:*:${AWS::AccountId}:dbuser:*/*'
              - !Sub 'arn:aws:redshift:${AWS::Region}:${AWS::AccountId}:dbname:${AWS::StackName}-redshift/medalliondb'
          - Effect: Allow
            Action: 'redshift:DescribeClusters'
            Resource: !Sub 'arn:aws:redshift:${AWS::Region}:${AWS::AccountId}:cluster:${AWS::StackName}-redshift'
          - Effect: Allow
            Action: 'glue:GetConnection'
