AWSTemplateFormatVersion: '2010-09-09'
Description: 'Integrate the Apache Spark Troubleshooting Agent for Amazon EMR with AWS DevOps Agent over AWS PrivateLink. Companion template for the AWS Big Data Blog post. Creates a VPC + subnets, an Interface VPC Endpoint for SageMaker Unified Studio MCP, the SigV4 IAM role for AWS DevOps Agent, and a demo EMR Serverless workload. us-east-1 only.'

Parameters:

  TroubleshootingRoleName:
    Type: String
    Default: SparkTroubleshootingRole
    Description: 'Name of the IAM role created for Spark troubleshooting. AWS DevOps Agent assumes this role when calling the Apache Spark Troubleshooting Agent for Amazon EMR (via the SageMaker Unified Studio MCP server).'
    AllowedPattern: '^[a-zA-Z0-9+=,.@_-]+$'
    ConstraintDescription: Must be a valid IAM role name

  VpcCidr:
    Type: String
    Default: '10.20.0.0/16'
    Description: 'CIDR block for the dedicated VPC created by this stack. Must not overlap with any existing VPC in the account that you intend to peer with.'
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
    ConstraintDescription: Must be a valid IPv4 CIDR (e.g., 10.20.0.0/16)

# ----------------------------------------------------------------------------
# Region-scope guardrail. The SMUS service endpoint name and the SageMaker
# Unified Studio MCP endpoint hostname are region-specific. This template is
# published for us-east-1 only. Subnet AZs are discovered dynamically at
# deploy time via the SMUSAzDiscovery custom resource, so no per-account AZ
# tweaking is required.
# ----------------------------------------------------------------------------
Rules:
  RegionMustBeUsEast1:
    Assertions:
      - Assert: !Equals [!Ref AWS::Region, 'us-east-1']
        AssertDescription: 'This template is currently published for us-east-1 only. To deploy in other regions, fork the template and update the SMUS service endpoint hostname.'

Resources:

  # ============================================================================
  # NETWORKING
  #
  # Dedicated VPC with two isolated subnets in SMUS-supported AZs. No internet
  # gateway, NAT gateway, or custom routes are required:
  #   - SageMaker Unified Studio MCP is reached via an Interface VPC Endpoint
  #     attached to these subnets.
  #   - AWS DevOps Agent's private connection (created separately in the
  #     console) is a managed VPC Lattice resource gateway. It injects routes
  #     to the Lattice managed prefix list automatically when it points at
  #     this VPC's subnets.
  # ============================================================================

  DemoVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: spark-troubleshooting-devops-agent-vpc
        - Key: Purpose
          Value: SparkTroubleshootingDevOpsAgent

  # ============================================================================
  # AZ DISCOVERY (CUSTOM RESOURCE)
  #
  # AWS randomizes the physical-AZ-to-logical-AZ mapping per account, so the
  # logical AZ letters that support the SMUS Interface VPC Endpoint differ from
  # customer to customer. This custom resource calls
  # ec2:DescribeVpcEndpointServices at deploy time and returns two AZs the
  # account actually supports. The subnets below use those values.
  #
  # Source of truth for the Python lives at scripts/az_discovery.py in this
  # repository. Keep both in sync when making changes.
  # ============================================================================

  SMUSAzDiscoveryLambdaRole:
    Type: AWS::IAM::Role
    Metadata:
      guard:
        # cfn-guard suppression with justification:
        # - IAM_NO_INLINE_POLICY_CHECK: This role is single-purpose (owned by
        #   the SMUSAzDiscoveryFunction custom-resource Lambda). Inline
        #   Policies keep the permission grant co-located with the role for
        #   readability and prevent the policy from being reused by
        #   unintended principals.
        SuppressedRules:
          - IAM_NO_INLINE_POLICY_CHECK
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DescribeVpcEndpointServices
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ec2:DescribeVpcEndpointServices
                Resource: '*'
      Tags:
        - Key: Purpose
          Value: SparkTroubleshootingDevOpsAgent

  SMUSAzDiscoveryFunction:
    Type: AWS::Lambda::Function
    Metadata:
      guard:
        # cfn-guard suppressions with justification:
        # - LAMBDA_DLQ_CHECK: This is a CloudFormation custom-resource
        #   Lambda. CFN invokes it synchronously via a pre-signed
        #   ResponseURL; DLQs only apply to asynchronous invocations, so
        #   configuring one would have no effect.
        # - LAMBDA_INSIDE_VPC: This Lambda runs BEFORE the DemoVPC exists;
        #   its own output determines which AZs the VPC subnets are placed
        #   in. Attaching it to a VPC is a bootstrapping impossibility. It
        #   only calls ec2:DescribeVpcEndpointServices via the regional EC2
        #   endpoint.
        SuppressedRules:
          - LAMBDA_DLQ_CHECK
          - LAMBDA_INSIDE_VPC
    Properties:
      Description: Returns two Availability Zones that support the SageMaker Unified Studio MCP endpoint service in this account.
      Runtime: python3.12
      Handler: index.lambda_handler
      Timeout: 30
      # Throttle to a single concurrent execution. This Lambda fires once
      # per stack Create/Update/Delete as a CloudFormation custom resource;
      # a hard concurrency cap of 1 is enough and also satisfies the
      # LAMBDA_CONCURRENCY_CHECK rule.
      ReservedConcurrentExecutions: 1
      Role: !GetAtt SMUSAzDiscoveryLambdaRole.Arn
      Code:
        ZipFile: |
          """AZ discovery for SMUS Interface VPC Endpoint. See
          scripts/az_discovery.py in this repository for the source-of-truth
          copy of this code."""
          import json
          import urllib.request
          import boto3


          def send_cfn_response(event, context, status, data, reason=None):
              response_url = event["ResponseURL"]
              # CloudFormation always supplies an HTTPS pre-signed S3 URL.
              # Refuse any other scheme defensively — closes the theoretical
              # file:/// or ftp:// class of misuse and satisfies Bandit B310.
              if not response_url.startswith("https://"):
                  raise ValueError(
                      f"Refusing to send response to a non-HTTPS URL: {response_url!r}"
                  )
              body = json.dumps({
                  "Status": status,
                  "Reason": reason or f"See CloudWatch Logs: {context.log_stream_name}",
                  "PhysicalResourceId": context.log_stream_name,
                  "StackId": event["StackId"],
                  "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"],
                  "Data": data,
              }).encode("utf-8")
              req = urllib.request.Request(
                  response_url,
                  data=body,
                  method="PUT",
                  headers={"Content-Type": ""},
              )
              # response_url is validated to be https:// above.
              urllib.request.urlopen(req, timeout=10)  # nosec B310


          def lambda_handler(event, context):
              if event["RequestType"] == "Delete":
                  send_cfn_response(event, context, "SUCCESS", {})
                  return

              region = context.invoked_function_arn.split(":")[3]
              service_name = f"com.amazonaws.{region}.sagemaker-unified-studio-mcp"

              try:
                  ec2 = boto3.client("ec2", region_name=region)
                  response = ec2.describe_vpc_endpoint_services(ServiceNames=[service_name])
                  details = response.get("ServiceDetails", [])
                  if not details:
                      raise RuntimeError(
                          f"VPC endpoint service {service_name} not found in {region}."
                      )
                  azs = details[0].get("AvailabilityZones", [])
                  if len(azs) < 2:
                      raise RuntimeError(
                          f"SMUS endpoint service is available in only {len(azs)} AZ(s) "
                          f"in this account: {azs}. At least two are required."
                      )
                  data = {
                      "SubnetAZ1": azs[0],
                      "SubnetAZ2": azs[1],
                      "AllAZs": ",".join(azs),
                  }
                  print(f"SMUS AZs available: {azs}. Selected {azs[0]} and {azs[1]}.")
                  send_cfn_response(event, context, "SUCCESS", data)
              except Exception as exc:
                  print(f"AZ discovery failed: {exc}")
                  send_cfn_response(event, context, "FAILED", {}, reason=str(exc))
      Tags:
        - Key: Purpose
          Value: SparkTroubleshootingDevOpsAgent

  SMUSAzDiscovery:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken: !GetAtt SMUSAzDiscoveryFunction.Arn

  DemoSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref DemoVPC
      AvailabilityZone: !GetAtt SMUSAzDiscovery.SubnetAZ1
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 4, 8]]
      Tags:
        - Key: Name
          Value: spark-troubleshooting-subnet-1

  DemoSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref DemoVPC
      AvailabilityZone: !GetAtt SMUSAzDiscovery.SubnetAZ2
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidr, 4, 8]]
      Tags:
        - Key: Name
          Value: spark-troubleshooting-subnet-2

  # ============================================================================
  # PRIVATELINK
  #
  # Interface VPC Endpoint for SageMaker Unified Studio MCP. AWS DevOps Agent
  # reaches this endpoint via its private connection (a Lattice resource
  # gateway provisioned in the console). Private DNS is enabled so the public
  # hostname sagemaker-unified-studio-mcp.us-east-1.api.aws resolves to the
  # endpoint's private ENIs from inside the VPC.
  # ============================================================================

  SMUSVPCESecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Inbound 443 from the VPC for the SageMaker Unified Studio MCP Interface VPC Endpoint.
      VpcId: !Ref DemoVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !GetAtt DemoVPC.CidrBlock
          Description: HTTPS from VPC CIDR (DevOps Agent resource gateway lives here)
      Tags:
        - Key: Purpose
          Value: SMUSPrivateLink

  SMUSVPCEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref DemoVPC
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.sagemaker-unified-studio-mcp'
      VpcEndpointType: Interface
      SubnetIds: [!Ref DemoSubnet1, !Ref DemoSubnet2]
      SecurityGroupIds: [!Ref SMUSVPCESecurityGroup]
      PrivateDnsEnabled: true

  # ============================================================================
  # DEMO BUCKET
  #
  # Single S3 bucket for both demo data and logs. After the stack deploys, the
  # reader copies the PySpark script and Parquet dataset from the cloned GitHub
  # repo into this bucket. EMR Serverless writes Spark event logs and
  # driver/executor stdout/stderr under the logs/ prefix.
  # ============================================================================

  DemoBucket:
    Type: AWS::S3::Bucket
    # checkov:skip=CKV_AWS_18: Access logging is not enabled for this demo bucket. The bucket is short-lived (created and destroyed by the blog reader within a single walkthrough); adding a second bucket to receive access logs is out of scope for the demo template.
    Metadata:
      guard:
        # cfn-guard suppressions with justification:
        # - S3_BUCKET_DEFAULT_LOCK_ENABLED: Object Lock (WORM retention) would
        #   prevent the BucketCleanup Lambda from emptying this bucket at
        #   stack teardown. Object Lock is intentionally not enabled.
        # - S3_BUCKET_LOGGING_ENABLED: Access logging requires a second S3
        #   bucket to receive logs, which is out of scope for the short-lived
        #   demo bucket. Same rationale as the Checkov CKV_AWS_18 skip above.
        # - S3_BUCKET_NO_PUBLIC_RW_ACL: This rule looks for an explicit
        #   AccessControl property. We disable ACLs entirely via
        #   OwnershipControls.ObjectOwnership: BucketOwnerEnforced (stronger
        #   than setting AccessControl: Private), and additionally block all
        #   public access via PublicAccessBlockConfiguration. Public
        #   read/write is impossible on this bucket.
        SuppressedRules:
          - S3_BUCKET_DEFAULT_LOCK_ENABLED
          - S3_BUCKET_LOGGING_ENABLED
          - S3_BUCKET_NO_PUBLIC_RW_ACL
    Properties:
      # Note on bucket-squatting concerns:
      # The Slingshot RUBRIC "S3 Example Bucket Naming" rule suggests using
      # the amzn-s3-demo- prefix. That prefix is actually reserved by AWS at
      # the S3 service level and cannot be used from customer accounts (the
      # S3 CreateBucket API returns 403). The scanner's recommendation is
      # therefore not implementable.
      #
      # Squatting is not a real concern for this name in practice: the
      # bucket name is composed at deploy time with the caller's own AWS
      # account ID, which produces a per-account-unique name. Two customers
      # deploying this template cannot collide, and no external actor can
      # pre-register a name that includes another account's ID.
      BucketName: !Sub 'spark-troubleshooting-${AWS::AccountId}-${AWS::Region}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      # Modern AWS default: disable ACLs entirely; use bucket policy instead.
      # BucketOwnerEnforced also satisfies cfn-guard's S3_BUCKET_NO_PUBLIC_RW_ACL.
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      # Enable versioning so accidental overwrites are recoverable. The
      # BucketCleanup Lambda already iterates list_object_versions and deletes
      # both current versions and delete markers, so the cleanup on stack
      # teardown still works with versioning enabled.
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Purpose
          Value: SparkTroubleshootingDevOpsAgentDemo

  # ============================================================================
  # BUCKET CLEANUP (CUSTOM RESOURCE)
  #
  # AWS CloudFormation refuses to delete a non-empty S3 bucket. During the
  # demo, DemoBucket accumulates Spark event logs and driver/executor logs,
  # plus whatever the reader has manually uploaded. Without this Lambda, the
  # reader must run `aws s3 rm s3://<bucket> --recursive` before deleting the
  # stack. With it, `cloudformation delete-stack` is enough.
  #
  # The custom resource depends on both the Lambda (via ServiceToken) and on
  # DemoBucket (via DependsOn). CloudFormation deletes in reverse dependency
  # order, so on stack delete the Delete event fires while both the Lambda
  # and the bucket still exist. The Lambda empties the bucket, then CFN
  # deletes the bucket, then the Lambda, then its role.
  #
  # Source of truth for the Python lives at scripts/bucket_cleanup.py in
  # this repository. Keep both in sync when making changes.
  # ============================================================================

  BucketCleanupLambdaRole:
    Type: AWS::IAM::Role
    Metadata:
      guard:
        # cfn-guard suppression with justification:
        # - IAM_NO_INLINE_POLICY_CHECK: This role is single-purpose (owned
        #   by the BucketCleanupFunction custom-resource Lambda). Inline
        #   Policies keep the permission grant co-located with the role for
        #   readability and prevent the policy from being reused by
        #   unintended principals.
        SuppressedRules:
          - IAM_NO_INLINE_POLICY_CHECK
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: EmptyDemoBucket
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:ListBucketVersions
                Resource: !Sub 'arn:aws:s3:::${DemoBucket}'
              - Effect: Allow
                Action:
                  - s3:DeleteObject
                  - s3:DeleteObjectVersion
                Resource: !Sub 'arn:aws:s3:::${DemoBucket}/*'
      Tags:
        - Key: Purpose
          Value: SparkTroubleshootingDevOpsAgent

  BucketCleanupFunction:
    Type: AWS::Lambda::Function
    Metadata:
      guard:
        # cfn-guard suppressions with justification:
        # - LAMBDA_DLQ_CHECK: This is a CloudFormation custom-resource
        #   Lambda. CFN invokes it synchronously via a pre-signed
        #   ResponseURL; DLQs only apply to asynchronous invocations, so
        #   configuring one would have no effect.
        # - LAMBDA_INSIDE_VPC: This Lambda talks to the regional Amazon S3
        #   endpoint to empty the demo bucket at stack delete. Attaching
        #   it to a VPC would require adding an S3 gateway endpoint to
        #   the VPC purely to support the cleanup Lambda — out of scope
        #   for a blog demo template. Since the Lambda only runs during
        #   stack Delete and holds no long-lived state, keeping it outside
        #   the VPC is the pragmatic choice.
        SuppressedRules:
          - LAMBDA_DLQ_CHECK
          - LAMBDA_INSIDE_VPC
    Properties:
      Description: Empties the demo S3 bucket on stack delete so CloudFormation can then delete the bucket itself.
      Runtime: python3.12
      Handler: index.lambda_handler
      Timeout: 300
      # Throttle to a single concurrent execution. This Lambda fires once
      # per stack Create/Update/Delete as a CloudFormation custom resource;
      # a hard concurrency cap of 1 is enough and also satisfies the
      # LAMBDA_CONCURRENCY_CHECK rule.
      ReservedConcurrentExecutions: 1
      Role: !GetAtt BucketCleanupLambdaRole.Arn
      Code:
        ZipFile: |
          """Bucket cleanup custom resource. See
          scripts/bucket_cleanup.py in this repository for the source-of-truth
          copy of this code."""
          import json
          import urllib.request
          import boto3


          def send_cfn_response(event, context, status, data, reason=None):
              response_url = event["ResponseURL"]
              # CloudFormation always supplies an HTTPS pre-signed S3 URL.
              # Refuse any other scheme defensively — closes the theoretical
              # file:/// or ftp:// class of misuse and satisfies Bandit B310.
              if not response_url.startswith("https://"):
                  raise ValueError(
                      f"Refusing to send response to a non-HTTPS URL: {response_url!r}"
                  )
              body = json.dumps({
                  "Status": status,
                  "Reason": reason or f"See CloudWatch Logs: {context.log_stream_name}",
                  "PhysicalResourceId": context.log_stream_name,
                  "StackId": event["StackId"],
                  "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"],
                  "Data": data,
              }).encode("utf-8")
              req = urllib.request.Request(
                  response_url,
                  data=body,
                  method="PUT",
                  headers={"Content-Type": ""},
              )
              # response_url is validated to be https:// above.
              urllib.request.urlopen(req, timeout=10)  # nosec B310


          def empty_bucket(bucket_name):
              s3 = boto3.client("s3")
              total_deleted = 0

              paginator = s3.get_paginator("list_object_versions")
              for page in paginator.paginate(Bucket=bucket_name):
                  to_delete = []
                  for obj in page.get("Versions", []) + page.get("DeleteMarkers", []):
                      to_delete.append({"Key": obj["Key"], "VersionId": obj["VersionId"]})
                  while to_delete:
                      batch, to_delete = to_delete[:1000], to_delete[1000:]
                      s3.delete_objects(Bucket=bucket_name, Delete={"Objects": batch})
                      total_deleted += len(batch)

              paginator = s3.get_paginator("list_objects_v2")
              for page in paginator.paginate(Bucket=bucket_name):
                  to_delete = [{"Key": obj["Key"]} for obj in page.get("Contents", [])]
                  while to_delete:
                      batch, to_delete = to_delete[:1000], to_delete[1000:]
                      s3.delete_objects(Bucket=bucket_name, Delete={"Objects": batch})
                      total_deleted += len(batch)

              return total_deleted


          def lambda_handler(event, context):
              request_type = event["RequestType"]
              props = event.get("ResourceProperties", {})
              bucket_name = props.get("BucketName")

              if request_type in ("Create", "Update"):
                  send_cfn_response(event, context, "SUCCESS", {"BucketName": bucket_name or ""})
                  return

              # Delete
              try:
                  if not bucket_name:
                      print("No BucketName in ResourceProperties; skipping empty.")
                      send_cfn_response(event, context, "SUCCESS", {})
                      return
                  print(f"Emptying s3://{bucket_name} …")
                  deleted = empty_bucket(bucket_name)
                  print(f"Deleted {deleted} object(s) / version(s) from {bucket_name}.")
                  send_cfn_response(event, context, "SUCCESS", {"Deleted": str(deleted)})
              except boto3.exceptions.botocore.exceptions.ClientError as exc:  # type: ignore[attr-defined]
                  code = exc.response.get("Error", {}).get("Code", "")
                  if code in ("NoSuchBucket", "404"):
                      print(f"Bucket {bucket_name} does not exist. Nothing to empty.")
                      send_cfn_response(event, context, "SUCCESS", {})
                      return
                  print(f"Bucket empty failed: {exc}")
                  send_cfn_response(event, context, "FAILED", {}, reason=str(exc))
              except Exception as exc:
                  print(f"Bucket empty failed: {exc}")
                  send_cfn_response(event, context, "FAILED", {}, reason=str(exc))
      Tags:
        - Key: Purpose
          Value: SparkTroubleshootingDevOpsAgent

  BucketCleanup:
    Type: AWS::CloudFormation::CustomResource
    # Explicit DependsOn ensures the custom resource's Delete event fires
    # BEFORE the bucket is deleted at stack teardown time. Without this,
    # CFN could delete the bucket in parallel with the custom resource and
    # the bucket-not-empty error returns.
    DependsOn: DemoBucket
    Metadata:
      # cfn-lint W3005 flags this DependsOn as redundant because
      # BucketName below already references DemoBucket via !Ref. The !Ref
      # gives us a create-order dependency, but the explicit DependsOn
      # is what guarantees delete-order: the custom resource is deleted
      # before the bucket at teardown, so the Lambda has a live bucket
      # to empty. This is a deliberate design choice; the warning is
      # suppressed only for this specific resource.
      cfn-lint:
        config:
          ignore_checks:
            - W3005
    Properties:
      ServiceToken: !GetAtt BucketCleanupFunction.Arn
      # Pass the bucket name in as a property so the Lambda can read it from
      # event.ResourceProperties.BucketName. Never resolve !Ref inside the
      # ZipFile — the Lambda code is a static string.
      BucketName: !Ref DemoBucket

  # ============================================================================
  # AWS DEVOPS AGENT TROUBLESHOOTING ROLE
  #
  # Trust: AWS DevOps Agent service principal (aidevops.amazonaws.com) with
  # SourceAccount + SourceArn confused-deputy guards as recommended by the
  # DevOps Agent capability-provider wizard.
  # ============================================================================

  SparkTroubleshootingRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref TroubleshootingRoleName
      Description: Role assumed by AWS DevOps Agent to invoke the Apache Spark Troubleshooting Agent for Amazon EMR (via the SageMaker Unified Studio MCP server).
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowDevOpsAgentAssumeRole
            Effect: Allow
            Principal:
              Service: aidevops.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub 'arn:aws:aidevops:${AWS::Region}:${AWS::AccountId}:service/*'
          - Sid: AllowSameAccountAssumeRole
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: sts:AssumeRole
      Tags:
        - Key: Purpose
          Value: SparkTroubleshootingDevOpsAgent
        - Key: ManagedBy
          Value: CloudFormation

  # SMUS MCP invoke permissions
  MCPInvokeAccess:
    Type: AWS::IAM::Policy
    Metadata:
      # cfn-lint W3037 flags 'sagemaker-unified-studio-mcp' as unknown because
      # cfn-lint's built-in list of IAM service prefixes has not yet caught up
      # with this newly released service. The prefix is valid — AWS DevOps
      # Agent uses these exact actions to invoke the MCP server.
      cfn-lint:
        config:
          ignore_checks:
            - W3037
    Properties:
      PolicyName: MCPInvokeAccess
      Roles: [!Ref SparkTroubleshootingRole]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: InvokeSMUSMcp
            Effect: Allow
            Action:
              - 'sagemaker-unified-studio-mcp:InvokeMcp'
              - 'sagemaker-unified-studio-mcp:CallReadOnlyTool'
              - 'sagemaker-unified-studio-mcp:CallPrivilegedTool'
            Resource: '*'

  # EMR-on-EC2 read permissions (always-on)
  #
  # The statements below are split by ARN scope:
  #  * EMREC2PerClusterRead — scoped to cluster ARNs in the current account
  #    and region. Covers describe-style APIs and Persistent App UI APIs
  #    that support resource-level permissions.
  #  * EMREC2AccountWideList — restricted to two APIs that do not support
  #    resource-level permissions per AWS documentation
  #    (elasticmapreduce:ListClusters, elasticmapreduce:DescribeJobFlows).
  #    These must use Resource: '*'.
  #
  # The former EMRClusterLogsFromS3 statement (s3:GetObject on Resource: '*')
  # is intentionally omitted. The demo workload runs on EMR Serverless and
  # does not require reading EMR-on-EC2 cluster logs from an arbitrary S3
  # bucket. Customers extending this role for EMR-on-EC2 should add a
  # statement scoped to their specific cluster-logs bucket ARN.
  EMRReadAccess:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: EMRReadAccess
      Roles: [!Ref SparkTroubleshootingRole]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: EMREC2PerClusterRead
            Effect: Allow
            Action:
              - 'elasticmapreduce:DescribeCluster'
              - 'elasticmapreduce:DescribeStep'
              - 'elasticmapreduce:ListSteps'
              - 'elasticmapreduce:CreatePersistentAppUI'
              - 'elasticmapreduce:DescribePersistentAppUI'
              - 'elasticmapreduce:GetPersistentAppUIPresignedURL'
            Resource: !Sub 'arn:aws:elasticmapreduce:${AWS::Region}:${AWS::AccountId}:cluster/*'
          - Sid: EMREC2AccountWideList
            Effect: Allow
            Action:
              - 'elasticmapreduce:ListClusters'
              - 'elasticmapreduce:DescribeJobFlows'
            # These APIs do not support resource-level permissions and
            # require Resource: '*' per AWS documentation.
            Resource: '*'

  # EMR Serverless read permissions (always-on)
  EMRServerlessReadAccess:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: EMRServerlessReadAccess
      Roles: [!Ref SparkTroubleshootingRole]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: EMRServerlessDescribeAndList
            Effect: Allow
            Action:
              - 'emr-serverless:GetJobRun'
              - 'emr-serverless:GetApplication'
              - 'emr-serverless:ListApplications'
              - 'emr-serverless:ListJobRuns'
              - 'emr-serverless:ListJobRunAttempts'
              - 'emr-serverless:GetDashboardForJobRun'
              - 'emr-serverless:ListTagsForResource'
            Resource: '*'
          - Sid: EMRServerlessCloudWatchLogs
            Effect: Allow
            Action:
              - 'logs:GetLogEvents'
              - 'logs:FilterLogEvents'
            Resource: !Sub 'arn:aws:logs:*:${AWS::AccountId}:log-group:/aws/emr-serverless/*'

  # AWS Glue read permissions (always-on)
  GlueReadAccess:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: GlueReadAccess
      Roles: [!Ref SparkTroubleshootingRole]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: GlueJobReadAccess
            Effect: Allow
            Action:
              - 'glue:GetJob'
              - 'glue:GetJobRun'
              - 'glue:GetJobRuns'
              - 'glue:GetJobs'
              - 'glue:BatchGetJobs'
            Resource: '*'
          - Sid: GlueCloudWatchLogs
            Effect: Allow
            Action:
              - 'logs:GetLogEvents'
              - 'logs:FilterLogEvents'
            Resource: !Sub 'arn:aws:logs:*:${AWS::AccountId}:log-group:/aws-glue/*'
          - Sid: GlueSparkWebUI
            Effect: Allow
            Action:
              - 'glue:RequestLogParsing'
              - 'glue:GetLogParsingStatus'
              - 'glue:GetEnvironment'
              - 'glue:GetStage'
              - 'glue:GetStages'
              - 'glue:GetStageFiles'
              - 'glue:BatchGetStageFiles'
              - 'glue:GetStageAttempt'
              - 'glue:GetStageAttemptTaskList'
              - 'glue:GetStageAttemptTaskSummary'
              - 'glue:GetExecutors'
              - 'glue:GetExecutorsThreads'
              - 'glue:GetStorage'
              - 'glue:GetStorageUnit'
              - 'glue:GetQueries'
              - 'glue:GetQuery'
              - 'glue:GetDashboardUrl'
            Resource: '*'

  # S3 read access on the demo bucket for the troubleshooting role.
  # The agent needs to read the PySpark source code and Spark event logs
  # to produce line-numbered root cause analysis.
  SourceCodeAndEventLogsAccess:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: SourceCodeAndEventLogsAccess
      Roles: [!Ref SparkTroubleshootingRole]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DemoBucketRead
            Effect: Allow
            Action:
              - 's3:GetObject'
              - 's3:ListBucket'
            Resource:
              - !Sub 'arn:aws:s3:::${DemoBucket}'
              - !Sub 'arn:aws:s3:::${DemoBucket}/*'

  # ============================================================================
  # DEMO WORKLOAD
  #
  # The customer events analytics demo referenced by the blog post.
  # ============================================================================

  DemoExecutionRole:
    Type: AWS::IAM::Role
    Metadata:
      guard:
        # cfn-guard IAM_NO_INLINE_POLICY_CHECK: prefer AWS::IAM::ManagedPolicy
        # over inline policies. Inline is deliberately kept here so the demo
        # template stays self-contained and the reader sees the role + its
        # permissions in one place. Converting to a managed policy adds a
        # separate resource with no functional benefit.
        SuppressedRules:
          - IAM_NO_INLINE_POLICY_CHECK
    Properties:
      RoleName: EMRServerlessExecutionRole-AnalyticsEvents
      Description: Execution role assumed by the analytics-events-platform EMR Serverless application's Spark drivers and executors.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: emr-serverless.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AnalyticsEventsExecutionAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: DemoBucketRead
                Effect: Allow
                Action:
                  - 's3:GetObject'
                  - 's3:ListBucket'
                Resource:
                  - !Sub 'arn:aws:s3:::${DemoBucket}'
                  - !Sub 'arn:aws:s3:::${DemoBucket}/*'
              - Sid: DemoBucketLogsWrite
                Effect: Allow
                Action:
                  - 's3:PutObject'
                  - 's3:DeleteObject'
                Resource:
                  - !Sub 'arn:aws:s3:::${DemoBucket}/logs/*'
              - Sid: EMRServerlessCloudWatchLogs
                Effect: Allow
                Action:
                  - 'logs:CreateLogGroup'
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                  - 'logs:DescribeLogStreams'
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/emr-serverless/*'

  DemoApplication:
    Type: AWS::EMRServerless::Application
    Properties:
      Name: analytics-events-platform
      ReleaseLabel: emr-7.5.0
      Type: SPARK
      MaximumCapacity:
        Cpu: '16 vCPU'
        Memory: '64 GB'
        Disk: '42 GB'
      AutoStopConfiguration:
        Enabled: true
        IdleTimeoutMinutes: 15
      MonitoringConfiguration:
        ManagedPersistenceMonitoringConfiguration:
          Enabled: true
        S3MonitoringConfiguration:
          LogUri: !Sub 's3://${DemoBucket}/logs/'
      Tags:
        - Key: Purpose
          Value: SparkTroubleshootingDevOpsAgentDemo

  # ============================================================================
  # CLOUDWATCH ALARM
  #
  # Fires when the EMR Serverless application has any failed job in a 60-second
  # window. The blog reader references this alarm by name in the AWS DevOps
  # Agent chat to trigger an investigation through the Apache Spark
  # Troubleshooting Agent for Amazon EMR.
  # ============================================================================

  FailedJobsAlarm:
    Type: AWS::CloudWatch::Alarm
    Metadata:
      guard:
        # cfn-guard CLOUDWATCH_ALARM_ACTION_CHECK: alarm has no
        # AlarmActions / OKActions / InsufficientDataActions. This is
        # intentional. The alarm serves as a *lookup handle*: the blog
        # reader references it by name in the AWS DevOps Agent chat to
        # trigger an investigation. Adding SNS topics or auto-remediation
        # is out of scope for the demo and would provide no functional
        # benefit for this use case.
        SuppressedRules:
          - CLOUDWATCH_ALARM_ACTION_CHECK
    Properties:
      AlarmName: !Sub '${DemoApplication}-FailedJobs'
      AlarmDescription: 'Fires when the analytics-events-platform EMR Serverless application has at least one failed job in a 60-second window. Used by the AWS DevOps Agent + Apache Spark Troubleshooting Agent for Amazon EMR integration blog post to trigger an investigation from the agent chat.'
      Namespace: AWS/EMRServerless
      MetricName: FailedJobs
      Dimensions:
        - Name: ApplicationId
          Value: !Ref DemoApplication
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Tags:
        - Key: Purpose
          Value: SparkTroubleshootingDevOpsAgentDemo

Outputs:

  TroubleshootingRoleArn:
    Description: ARN of the IAM role to assign in the AWS DevOps Agent capability provider wizard (Authorization Configuration step).
    Value: !GetAtt SparkTroubleshootingRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-TroubleshootingRoleArn'

  TroubleshootingRoleName:
    Description: Name of the troubleshooting role
    Value: !Ref SparkTroubleshootingRole
    Export:
      Name: !Sub '${AWS::StackName}-TroubleshootingRoleName'

  MCPEndpointURL:
    Description: SMUS Spark troubleshooting MCP endpoint to register in DevOps Agent capability provider (MCP server details step).
    Value: !Sub 'https://sagemaker-unified-studio-mcp.${AWS::Region}.api.aws/spark-troubleshooting/mcp'

  MCPServiceName:
    Description: AWS service name to enter in the DevOps Agent SigV4 authorization step.
    Value: 'sagemaker-unified-studio-mcp'

  DemoVpcId:
    Description: ID of the dedicated VPC. Use this when configuring the AWS DevOps Agent private connection in the console.
    Value: !Ref DemoVPC
    Export:
      Name: !Sub '${AWS::StackName}-DemoVpcId'

  DemoSubnetIds:
    Description: Subnet IDs to use when configuring the AWS DevOps Agent private connection.
    Value: !Sub '${DemoSubnet1},${DemoSubnet2}'

  SMUSVpcEndpointId:
    Description: ID of the SageMaker Unified Studio MCP Interface VPC Endpoint.
    Value: !Ref SMUSVPCEndpoint
    Export:
      Name: !Sub '${AWS::StackName}-SMUSVpcEndpointId'

  SMUSVpcEndpointSecurityGroupId:
    Description: Security group attached to the SMUS VPC endpoint. Use the same security group when configuring the AWS DevOps Agent private connection.
    Value: !Ref SMUSVPCESecurityGroup

  DemoApplicationId:
    Description: EMR Serverless application ID
    Value: !Ref DemoApplication

  DemoBucket:
    Description: S3 bucket for demo artifacts (PySpark script under root, Parquet data under data/, Spark logs under logs/). After stack creation, copy the demo files from the cloned GitHub repo into this bucket.
    Value: !Ref DemoBucket

  DemoExecutionRoleArn:
    Description: EMR Serverless job execution role ARN
    Value: !GetAtt DemoExecutionRole.Arn

  FailedJobsAlarmName:
    Description: Name of the CloudWatch alarm that fires when the demo job fails. Reference this in the AWS DevOps Agent chat (e.g., 'Investigate alarm <name>').
    Value: !Ref FailedJobsAlarm

  FailedJobsAlarmArn:
    Description: ARN of the FailedJobs CloudWatch alarm
    Value: !GetAtt FailedJobsAlarm.Arn

  DemoSubmitJobCommand:
    Description: Sample command to submit the failing job. Replace <DemoBucket> with the DemoBucket output value if copy-pasting manually.
    Value: !Sub >
      aws emr-serverless start-job-run
      --region ${AWS::Region}
      --application-id ${DemoApplication}
      --execution-role-arn ${DemoExecutionRole.Arn}
      --name daily-customer-events-rollup
      --job-driver '{"sparkSubmit":{"entryPoint":"s3://${DemoBucket}/customer_events_aggregator.py","entryPointArguments":["${DemoBucket}"],"sparkSubmitParameters":"--conf spark.executor.cores=2 --conf spark.executor.memory=1g --conf spark.executor.pyspark.memory=256m --conf spark.executor.instances=2"}}'
      --configuration-overrides '{"monitoringConfiguration":{"s3MonitoringConfiguration":{"logUri":"s3://${DemoBucket}/logs/"}}}'
