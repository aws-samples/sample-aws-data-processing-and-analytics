[project]
name = "aws-data-reliability-copilot"
version = "0.1.0"
description = "An AWS sample for deterministic batch data validation and agent-assisted recovery with Amazon S3 Tables."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT-0" }
authors = [{ name = "Amazon Web Services" }]
classifiers = [
    "License :: OSI Approved :: MIT No Attribution License (MIT-0)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "boto3>=1.35.0,<2.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "strands-agents>=1.25.0,<2.0.0",
    "mcp>=1.23.0,<3.0.0",
]

[project.scripts]
abdr-generate = "agentic_batch_data_reliability.data_generator.generate_orders:main"
abdr-investigate = "agentic_batch_data_reliability.agent.investigator:main"
abdr-approve = "agentic_batch_data_reliability.orchestration.approval_cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "ruff>=0.9.0,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentic_batch_data_reliability"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "integration: requires configured AWS credentials and deployed resources",
    "e2e: requires a complete deployed sample",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
